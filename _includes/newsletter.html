<section class="newsletter-box" aria-labelledby="newsletter-title">
  <div class="newsletter-content">
    <h2 id="newsletter-title">Stay connected</h2>

    <p>
      Subscribe to receive updates from the Big Bat Database, including new
      resources, projects, and opportunities to contribute.
    </p>

    <form
      action="YOUR_MAILCHIMP_FORM_ACTION_URL"
      method="post"
      target="_blank"
      class="newsletter-form"
    >
      <label for="newsletter-email">Email address</label>

      <div class="newsletter-form-row">
        <input
          type="email"
          id="newsletter-email"
          name="EMAIL"
          placeholder="Your email address"
          required
        >

        <button type="submit">Subscribe</button>
      </div>
    </form>

    <p class="newsletter-privacy">
      You can unsubscribe at any time.
    </p>
  </div>
</section>
